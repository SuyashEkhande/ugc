name: ugc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ugc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ugc}
      POSTGRES_DB: ${POSTGRES_DB:-ugc}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ugc} -d ${POSTGRES_DB:-ugc}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ugc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ugcsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-ugc}
        ${MINIO_ROOT_PASSWORD:-ugcsecret} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-ugc-assets}

volumes:
  postgres-data:
  minio-data:
