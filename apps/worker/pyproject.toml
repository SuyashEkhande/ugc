[project]
name = "worker"
version = "0.1.0"
description = "AI Creative Studio - Celery worker (async research, generation, publish jobs)"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
